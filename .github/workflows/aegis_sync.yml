name: AEGIS Execution Node (IP)

on:
  schedule:
    # Runs every Wednesday at 12:00 UTC to catch Tuesday USPTO patent grants
    - cron: '0 12 * * 3'
  workflow_dispatch:

jobs:
  execute-aegis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests google-cloud-bigquery
        
      - name: Execute AEGIS Stream
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python aegis_sync.py
        
